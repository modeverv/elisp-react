<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>watchdog</title>
<!-- Give up on Lisp that does not answer within 1.5 s. -->
<meta name="elisp-react:timeout" content="1500">
<div id="app">Loading Emacs…</div>
<script type="text/emacs-lisp">
(react-define-component 'Watchdog
  :initial-state (lambda (_props) (list :count 0))
  :render (lambda (self)
            (jsx (div
                  (button (:class "count"
                           :on-click (lambda (_event)
                                       (react-set-state self :count (1+ (react-state self :count)))))
                          (format "%d" (react-state self :count)))
                  (button (:class "loop" :on-click (lambda (_event) (while t)))
                          "loop for ever")))))
(react-mount '(Watchdog) "#app")
</script>
<script type="module" src="/js/elisp-react.js"></script>
</html>
