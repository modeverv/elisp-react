name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The reconciler is plain Emacs Lisp: tested with a native Emacs, no browser.
  # (The browser test, test/e2e.mjs, needs Chrome and 150 MB of Emacs; run it locally.)
  test:
    name: Emacs Lisp tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test static file boundaries
        run: npm run test:static
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - name: Test react.el
        run: |
          emacs --version | head -1
          test/run-ert.sh
      - name: Test native server file boundaries
        run: npm run test:server-security

  # The site is the repository itself: static files, no build step.
  pages:
    name: Publish Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
