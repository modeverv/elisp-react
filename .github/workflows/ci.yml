name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The reconciler is plain Emacs Lisp: tested with a native Emacs, no browser.
  # (The browser test, test/e2e.mjs, needs Chrome and 150 MB of Emacs; run it locally.)
  test:
    name: Emacs Lisp tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test DOM attribute boundaries
        run: npm run test:dom
      - name: Test static file boundaries
        run: npm run test:static
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - name: Test react.el
        run: |
          emacs --version | head -1
          test/run-ert.sh
      - name: Test native server file boundaries
        run: npm run test:server-security
      # doc/api.md as a web page; a link to an anchor that is not there fails.
      - name: Build the API page
        run: npm run docs

  # The site is the repository itself, static files, and the API page made
  # from doc/api.md (tools/api-doc.mjs).
  pages:
    name: Publish Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the tags, for the versioned copies
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The site is the repository as it is, plus a copy of js/ and lisp/
      # of every release tag under v/VERSION/: a page that loads
      # v/0.1.0/js/elisp-react.js gets that release and its react.el, for
      # good, whatever main becomes.
      - name: Versioned copies
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          for tag in $(git tag -l 'v*'); do
            mkdir -p "_site/v/${tag#v}"
            git archive "$tag" js lisp LICENSE | tar -x -C "_site/v/${tag#v}"
          done
          ls _site/v 2>/dev/null || true
      # And doc/api.md as a page: /elisp-react/api/.
      - name: API page
        run: npm run docs -- --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
